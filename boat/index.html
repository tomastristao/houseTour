<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pérola RM · Belém</title>
<meta name="description" content="Pérola RM, a motor catamaran for up to 14 guests on the Tagus. Look round every deck in 3D.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root { --ink: #1d1d1f; --pill: #0071e3; --accent: #DE872E; --gut: clamp(20px, 5vw, 72px); --ease: cubic-bezier(.2, .7, .1, 1);
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
/* the script switches data-tone as the scene goes dark, so the words stay readable */
body[data-tone="light"] { --fg: var(--ink); --fg2: rgba(29, 29, 31, .62); --tag: rgba(255, 255, 255, .62); --line: rgba(29, 29, 31, .08); --shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.08); }
body[data-tone="dark"] { --fg: #f3f1ec; --fg2: rgba(243, 241, 236, .64); --tag: rgba(20, 20, 24, .5); --line: rgba(255, 255, 255, .1); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 44px rgba(0,0,0,.45); }
* { box-sizing: border-box; }
html, body { margin: 0; background: #f1eee9; }
body { color: var(--fg); font: 400 17px/1.45 var(--display); letter-spacing: -0.2px; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: color .5s; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--pill); outline-offset: 3px; border-radius: 8px; }
#gl { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; z-index: 0; }
#sizer { position: relative; z-index: -1; width: 1px; pointer-events: none; }
#nogl { display: none; position: fixed; inset: 0; z-index: 2; place-items: center; text-align: center; padding: 24px; color: var(--ink); background: #f5f5f7; }
#nogl.show { display: grid; }
/* top bar */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gut) 0; pointer-events: none; }
.nav > * { pointer-events: auto; }
.brand { font: 600 18px/1 var(--display); text-decoration: none; color: var(--fg); text-shadow: var(--shadow); }
.navr { display: flex; align-items: center; gap: 26px; }
.steps { display: flex; gap: 22px; }
.steps button { all: unset; cursor: pointer; padding: 8px 2px; font: 500 13px/1 var(--display); color: var(--fg2); text-shadow: var(--shadow); transition: color .3s; }
.steps button:hover, .steps button.cur { color: var(--fg); }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 10px 16px; font: 500 14px/1 var(--display); text-decoration: none; white-space: nowrap; transition: transform .25s var(--ease); }
.pill:hover { transform: translateY(-1px); }
.pill.blue { background: var(--pill); color: #fff; box-shadow: 0 8px 24px rgba(0, 113, 227, .28); }
.pill.glass { background: var(--tag); color: var(--fg); box-shadow: 0 0 0 1px var(--line) inset, var(--shadow); -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); }
.pill.big { padding: 14px 22px; font-size: 16px; }
/* words: fixed blocks over the picture, faded by the script. Type is sized by the smaller of the window's width and
   height, because the picture is drawn to the window's height: on a short window the words shrink with it. */
.ch { position: fixed; z-index: 4; left: var(--gut); top: clamp(84px, 18vh, 180px); max-width: min(470px, 34vw); display: grid; gap: clamp(10px, 1.6vh, 14px); opacity: 0; pointer-events: none; will-change: opacity, transform; }
.ch.on { pointer-events: auto; }
.ch.wide { max-width: min(560px, 39vw); }
.ch.center { left: 50%; top: clamp(40px, 7vh, 84px); text-align: center; justify-items: center; width: max-content; max-width: min(820px, calc(100vw - 2 * var(--gut))); }
.ch .label { margin: 0; font: 500 clamp(13px, 1.15vw, 17px)/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg2); white-space: nowrap; }
.ch .label b { color: var(--accent); font-weight: 500; }
.ch h1, .ch h2 { margin: 0; font-weight: 600; letter-spacing: -0.035em; line-height: 1.02; text-wrap: balance; text-shadow: var(--shadow); }
.ch h1 { font-size: clamp(30px, min(4.9vw, 7.6vh), 68px); }
.ch h2 { font-size: clamp(27px, min(4.6vw, 6.5vh), 58px); }
.ch p { margin: 0; font-size: clamp(16px, 1.3vw, 18px); color: var(--fg2); max-width: min(40ch, 31vw); text-shadow: var(--shadow); text-wrap: pretty; }
.ch p b { color: var(--fg); font-weight: 600; }
.ch.center p { max-width: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.ch.center .row { justify-content: center; }
.how { display: grid; gap: 9px; margin: 4px 0 0; padding: 0; list-style: none; }   /* one heading over several stops: the line for the stop in view is lit */
.how li { font: 500 clamp(17px, 1.45vw, 20px)/1.3 var(--display); text-shadow: var(--shadow); opacity: .32; transition: opacity .45s var(--ease); }
.how li.on { opacity: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 0; padding: 0; list-style: none; max-width: 35vw; }
.chips li { border-radius: 999px; padding: 8px 13px; background: var(--tag); font: 500 14px/1 var(--display); box-shadow: 0 0 0 1px var(--line) inset, var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.rail { position: fixed; right: 4px; top: 50%; transform: translateY(-50%); z-index: 5; display: none; gap: 6px; }
.rail button { width: 22px; height: 22px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
.rail button::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--fg2); opacity: .4; transition: all .3s var(--ease); }
.rail button.cur::before { width: 8px; height: 8px; background: var(--accent); opacity: 1; }
.hint { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 5; font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg2); transition: opacity .5s; pointer-events: none; }
@media (max-width: 900px) { .steps { display: none; } .rail { display: grid; } }
/* phones, and any window taller than it is wide: the picture on top, the words under it (the script uses the same test) */
@media (max-width: 760px), (max-aspect-ratio: 1/1) {
  .ch, .ch.wide, .ch.center { left: 20px; right: 20px; top: auto; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); width: auto; max-width: none; text-align: left; justify-items: start; gap: clamp(9px, 1.5vh, 13px); }
  .ch[data-p="0"] { bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }   /* the scroll hint sits under the first block */
  .ch .label { white-space: normal; font-size: 14px; }
  .ch h1 { font-size: clamp(30px, min(11vw, 5.7vh), 48px); }
  .ch h2 { font-size: clamp(26px, min(8.6vw, 4.7vh), 40px); }
  .ch p { font-size: 15px; max-width: 40ch; }
  .how li { font-size: 16px; } .chips { max-width: none; gap: 6px; } .chips li { padding: 7px 10px; font-size: 13px; }
  .ch.center .row { justify-content: flex-start; } .pill.big { padding: 12px 15px; font-size: 15px; }
  .ch .wideonly { display: none; }                                              /* a sentence only wide windows have room for */
}
@media (prefers-reduced-motion: reduce) { .ch, .pill, .how li { transition: none; } }
/* a page with no words: the dots are the only control, at every width */
.rail { display: grid; right: 8px; } .hint { font-size: 18px; }
#veil { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #f1eee9; transition: opacity 1.1s cubic-bezier(.2,.7,.1,1); } #veil.gone { opacity: 0; pointer-events: none; } #veil div { font: 600 clamp(34px, 6vw, 60px)/1 -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -.04em; color: #1d1d1f; } #veil div { text-align: center; } #veil .vbar { display: block; width: min(260px, 62vw); height: 3px; margin: 22px auto 0; border-radius: 3px; background: rgba(29,29,31,.08); overflow: hidden; } #veil .vbar b { display: block; height: 100%; border-radius: 3px; background: #DE872E; transform: scaleX(.02); transform-origin: left; transition: transform .5s cubic-bezier(.2,.7,.1,1); } #veil .vk { display: block; margin-bottom: 18px; font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: #a39b90; } #veil .vft { display: block; margin-top: 26px; font: 400 13px/1.4 -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; letter-spacing: 0; color: #8a847c; } .still #veil { display: none; } #veil small { display: block; margin-top: 14px; font: 500 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: #8a847c; text-align: center; }
</style>
